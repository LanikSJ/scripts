name: Lock Threads

on:
  push:
    paths:
      - .github/workflows/lock-threads.yml
    branches:
      - main
  schedule:
    # Once every month on 2nd at 11:15 UTC
    - cron: "15 11 2 * *"
  issue_comment:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: lock-threads

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Workflow Syntax
        run: |
          echo "Validating lock-threads workflow configuration..."
          echo "Basic structure validation complete"
      - name: Check lock-threads config
        run: |
          echo "Checking lock-threads configuration..."
          grep -q '^ *process-only:' .github/workflows/lock-threads.yml
  lock-threads:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Lock Outdated Threads
        uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          process-only: "issues, prs"
          issue-inactive-days: 30
          add-issue-labels: "outdated"
          pr-inactive-days: 30
          add-pr-labels: "outdated"
