searchd
{
	listen		= 3313
        log		= /var/lib/sphinx/var/log/searchd.log
        query_log	= /var/lib/sphinx/var/log/query.log
	crash_log_path	= /var/lib/sphinx/var/log/crash.log
	read_timeout	= 5
	max_children	= 30
        pid_file	= /var/lib/sphinx/var/log/searchd.pid
	max_matches	= 500000
        seamless_rotate	= 1
	preopen_indexes	= 0
	unlink_old	= 1
}

indexer
{
   	mem_limit 	= 256M
}

